<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"><meta name="theme-color" content="#11120f"><meta name="description" data-i18n-content="description" content="Grand T — wspólna, miejska gra arcade z widokiem z góry. Zbieraj przesyłki i nie zgub ekipy z oczu.">
  <title>Grand T — gra miejska</title><meta name="game-version" content="__RELEASE_VERSION__">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg?v=__BUILD_SHA__">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../style.css?v=__BUILD_SHA__">
</head>
<body class="play-page">
  <main class="shell">
    <header class="topbar"><a class="brand" href="../"><span class="brand-mark">✳</span> KANAPÓWKI<span class="brand-dot">.</span></a><div id="night-mobile-top-controls" class="night-mobile-top-controls"></div><div class="night-topbar-actions"><a class="back-link" href="./" data-i18n="back">← EKRAN STARTOWY</a></div></header>
    <section class="night-layout" aria-label="Gra Grand T" data-i18n-aria-label="gameAria">
      <div class="night-game-column">
        <div class="night-frame">
          <canvas id="city" aria-label="Widok z góry na nocne miasto" data-i18n-aria-label="canvasAria"></canvas>
          <span id="wanted-indicator" class="wanted-indicator" aria-label="Poziom alarmu" data-i18n-aria-label="wantedAria" hidden></span>
          <div class="night-overlay" id="overlay"><div class="night-overlay-card"><span class="sunburst">✳</span><h2 id="overlay-title">Grand T</h2><p id="overlay-copy" data-i18n="intro">Zbierzcie 12 przesyłek i wróćcie w jednym kawałku.</p><div class="night-name-start"><label for="player-name-start" data-i18n="nameStart">Twoja nazwa (opcjonalnie)</label><input id="player-name-start" type="text" maxlength="18" autocomplete="nickname" placeholder="Bez nazwy: P1, P2…" data-i18n-placeholder="namePlaceholder" aria-label="Nazwa gracza" data-i18n-aria-label="nameAria"></div><div class="night-game-modes"><button class="start-button night-mode-button" id="start" type="button" data-i18n="local">Gra lokalna</button><button id="multiplayer-online" type="button" class="night-multiplayer-button night-mode-button" data-i18n="online">Gra online</button></div>
            <div class="night-multiplayer-actions"><div id="multiplayer-join-area" class="night-multiplayer-join"><label for="multiplayer-key" data-i18n="joinTitle">Dołącz do pokoju</label><div><input id="multiplayer-key" type="text" autocomplete="off" spellcheck="false" placeholder="ABCDEF lub link" data-i18n-placeholder="joinPlaceholder" aria-label="Klucz pokoju lub link" data-i18n-aria-label="joinKeyAria"><button id="multiplayer-join" type="button" data-i18n="join">Dołącz</button></div></div><label class="night-language-picker" for="language-select"><span class="night-language-flag" id="language-flag" aria-hidden="true">🇵🇱</span><svg class="night-language-chevron" aria-hidden="true" viewBox="0 0 16 16" width="14" height="14" fill="none"><path d="m3 6 5 5 5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><select id="language-select" aria-label="Język / Språk"><option value="pl">🇵🇱 Polski</option><option value="sv">🇸🇪 Svenska</option></select></label></div></div></div>
          <div class="night-hud"><span class="night-round" id="round-label">12 PRZESYŁEK</span><span class="zoom-indicator" id="zoom-indicator">KADR 100%</span><span class="ammo-indicator" data-i18n="ammo">AMMO ∞</span><span class="bonus-indicator"><span data-i18n="bonus">BONUS $</span><b id="cash-score">0</b></span><span class="best-label"><span data-i18n="deliveries">PRZESYŁKI</span> <b id="score">0 / 12</b></span></div>
        </div>
        <div class="under-game"><span><i class="live-dot"></i> <span id="status">MIASTO CZEKA</span></span></div>
        <div id="multiplayer-room" class="night-room" hidden aria-label="Pokój multiplayer" data-i18n-aria-label="roomAria">
          <button id="multiplayer-copy" type="button" data-i18n="copy">Kopiuj link</button>
          <button id="multiplayer-leave" type="button" data-i18n="disconnect">Rozłącz</button>
          <p id="multiplayer-status" class="night-room-status" role="status" aria-live="polite" data-i18n="connecting">Łączenie...</p>
          <input id="multiplayer-link" type="hidden">
          <input id="multiplayer-room-key" type="hidden">
        </div>
      </div>
      <aside class="night-sidebar"><span id="player-count" class="visually-hidden">0</span><div id="player-list" class="player-list"></div><div class="night-language-game-slot"></div></aside>
    </section>
    <div id="touch-controls" class="touch-controls night-touch" aria-label="P1 dotyk" data-i18n-aria-label="touchAria">
      <div class="touch-joystick" data-touch-joystick role="application" aria-label="Sterowanie analogowe P1" data-i18n-aria-label="stickAria">
        <span class="touch-joystick__base" aria-hidden="true"></span><span class="touch-joystick__knob" aria-hidden="true"></span>
      </div>
      <div class="touch-actions"><button data-touch-action="fire" aria-label="Strzał" data-i18n-aria-label="fire" title="Strzał" data-i18n-title="fire"><svg class="touch-action-icon touch-fire-icon" viewBox="0 0 48 48" aria-hidden="true" focusable="false"><circle cx="24" cy="24" r="11"/><circle cx="24" cy="24" r="3"/><path d="M24 3v10m0 22v10M3 24h10m22 0h10"/></svg></button><div class="touch-interact-stack"><div class="touch-drive-pedals"><button data-touch-action="brake" type="button" disabled aria-label="Hamuj i cofaj" data-i18n-aria-label="driveBrake" title="Hamuj i cofaj" data-i18n-title="driveBrake"><svg class="touch-pedal-icon" viewBox="0 0 48 48" aria-hidden="true" focusable="false"><path d="M24 8v31m-12-12 12 12 12-12M14 8h20"/></svg></button><button data-touch-action="forward" type="button" disabled aria-label="Jedź do przodu" data-i18n-aria-label="driveForward" title="Jedź do przodu" data-i18n-title="driveForward"><svg class="touch-pedal-icon" viewBox="0 0 48 48" aria-hidden="true" focusable="false"><path d="M24 40V9M12 21 24 9l12 12M14 40h20"/></svg></button></div><button data-touch-action="interact" aria-label="Akcja" data-i18n-aria-label="action" title="Akcja" data-i18n-title="action"><svg class="touch-action-icon" viewBox="0 0 48 48" aria-hidden="true" focusable="false"><rect x="7" y="8" width="21" height="32" rx="5"/><path d="M12 15h11l3 8H9l3-8ZM12 33h11M43 24H29m7-7-7 7 7 7"/></svg></button></div></div>
    </div>
    <footer><span data-i18n="footerMotto">MAJĄC MAPĘ, NIKT NIE ZGINIE.</span><span><a href="./" data-i18n="back">← EKRAN STARTOWY</a> &nbsp; · &nbsp; <span data-i18n="playTogether">GRAJ RAZEM</span> <b>✳</b></span></footer>
  </main><script src="mobile-zoom.js?v=__BUILD_SHA__"></script><script src="../update-check.js?v=__BUILD_SHA__&amp;release=__RELEASE_VERSION__"></script><script src="../performance-hud.js?v=__BUILD_SHA__"></script><script src="locale.js?v=__BUILD_SHA__"></script><script src="telemetry.js?v=__BUILD_SHA__"></script><script src="multiplayer.js?v=__BUILD_SHA__"></script><script src="simulation-clock.js?v=__BUILD_SHA__"></script><script src="client-prediction.js?v=__BUILD_SHA__"></script><script src="traffic-lights.js?v=__BUILD_SHA__"></script><script src="player-names.js?v=__BUILD_SHA__"></script><script src="game.js?v=__BUILD_SHA__"></script>
</body>
</html>
