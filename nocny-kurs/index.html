<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#11120f"><meta name="description" content="Nocny Kurs — wspólna, miejska gra arcade z widokiem z góry. Zbieraj przesyłki i nie zgub ekipy z oczu.">
  <title>Nocny Kurs — gra miejska</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../style.css?v=__BUILD_SHA__">
</head>
<body class="play-page">
  <main class="shell">
    <header class="topbar"><a class="brand" href="../"><span class="brand-mark">✳</span> KANAPÓWKI<span class="brand-dot">.</span></a><a class="back-link" href="../">← KATALOG GIER</a></header>
    <section class="night-layout" aria-label="Gra Nocny Kurs">
      <div class="night-game-column">
        <div class="night-frame">
          <canvas id="city" aria-label="Widok z góry na nocne miasto"></canvas>
          <div class="night-overlay" id="overlay"><div class="night-overlay-card"><span class="sunburst">✳</span><h2 id="overlay-title"></h2><p id="overlay-copy"></p><button class="start-button" id="start">Odpalamy <span>↗</span></button></div></div>
          <div class="night-hud"><span><b id="timer">90</b><small>SEK</small></span><span class="night-round" id="round-label">12 PRZESYŁEK</span><span class="zoom-indicator" id="zoom-indicator">KADR 100%</span><span class="ammo-indicator">AMMO ∞</span><span class="best-label">PRZESYŁKI <b id="score">0 / 12</b></span></div>
        </div>
        <div class="under-game"><span><i class="live-dot"></i> <span id="status">MIASTO CZEKA</span></span></div>
      </div>
      <aside class="night-sidebar"><span id="player-count" class="visually-hidden">0</span><div id="player-list" class="player-list"></div></aside>
    </section>
    <div id="touch-controls" class="touch-controls night-touch" aria-label="P1 dotyk">
      <div class="touch-dpad"><button data-touch-dir="up" aria-label="Góra">↑</button><button data-touch-dir="left" aria-label="Lewo">←</button><button data-touch-dir="down" aria-label="Dół">↓</button><button data-touch-dir="right" aria-label="Prawo">→</button></div>
      <div class="touch-actions"><button data-touch-action="fire">STRZAŁ</button><button data-touch-action="interact">AUTO</button></div>
    </div>
    <footer><span>MAJĄC MAPĘ, NIKT NIE ZGINIE.</span><span><a href="../">← KATALOG GIER</a> &nbsp; · &nbsp; GRAJ RAZEM <b>✳</b></span></footer>
  </main><script src="../update-check.js?v=__BUILD_SHA__&amp;release=__RELEASE_VERSION__"></script><script src="game.js?v=__BUILD_SHA__"></script>
</body>
</html>
